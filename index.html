
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hindi GK Quiz</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eef2ff;color:#172033}
header{background:#4f46e5;color:white;text-align:center;padding:24px 10px}
main{max-width:600px;margin:25px auto;padding:15px}
.card{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 15px #0001}
button{width:100%;padding:14px;margin:7px 0;border:1px solid #cbd5e1;border-radius:10px;background:white;font-size:16px;text-align:left}
button:disabled{opacity:1}
.next{background:#4f46e5;color:white;text-align:center;border:0}
#msg{font-weight:bold}
</style>
</head>
<body>
<header>
<h1>🧠 हिंदी GK Quiz</h1>
<p>हर दिन कुछ नया सीखें!</p>
</header>
<main><div class="card">
<p id="progress"></p>
<h2 id="question"></h2>
<div id="options"></div>
<p id="msg"></p>
<button id="next" class="next" hidden>अगला सवाल →</button>
<div id="result" hidden></div>
<button id="restart" class="next" hidden>फिर से खेलें</button>
</div></main>
<script>
const qs=[
{q:"भारत की राजधानी क्या है?",o:["मुंबई","नई दिल्ली","जयपुर","भोपाल"],a:1},
{q:"छत्तीसगढ़ की राजधानी क्या है?",o:["बिलासपुर","दुर्ग","रायपुर","जगदलपुर"],a:2},
{q:"सौरमंडल का सबसे बड़ा ग्रह कौन है?",o:["पृथ्वी","मंगल","शनि","बृहस्पति"],a:3},
{q:"भारत का राष्ट्रीय पशु कौन है?",o:["शेर","बाघ","हाथी","तेंदुआ"],a:1},
{q:"भारत का संविधान कब लागू हुआ?",o:["1947","26 जनवरी 1950","1949","1952"],a:1},
{q:"पानी का रासायनिक सूत्र क्या है?",o:["CO2","O2","H2O","NaCl"],a:2},
{q:"भारत का राष्ट्रीय गान किसने लिखा?",o:["प्रेमचंद","रवींद्रनाथ टैगोर","गांधीजी","नेहरू"],a:1},
{q:"एक सप्ताह में कितने दिन होते हैं?",o:["5","6","7","8"],a:2},
{q:"भारत का स्वतंत्रता दिवस कब है?",o:["26 जनवरी","15 अगस्त","2 अक्टूबर","14 नवंबर"],a:1},
{q:"पौधे प्रकाश संश्लेषण में कौन-सी गैस लेते हैं?",o:["ऑक्सीजन","नाइट्रोजन","कार्बन डाइऑक्साइड","हाइड्रोजन"],a:2}
];
let i=0,score=0,done=false;
const $=id=>document.getElementById(id);
function show(){
done=false;$("msg").textContent="";$("next").hidden=true;
$("result").hidden=true;$("restart").hidden=true;$("options").innerHTML="";
$("progress").textContent=`सवाल ${i+1}/${qs.length} | स्कोर: ${score}`;
$("question").textContent=qs[i].q;
qs[i].o.forEach((v,n)=>{
let b=document.createElement("button");
b.textContent=["A","B","C","D"][n]+". "+v;
b.onclick=()=>answer(n);$("options").appendChild(b);
});
}
function answer(n){
if(done)return;done=true;
let a=qs[i].a;
if(n===a){score++;$("msg").textContent="✅ बिल्कुल सही जवाब!";}
else $("msg").textContent="❌ सही जवाब: "+qs[i].o[a];
[...$("options").children].forEach((b,j)=>{
b.disabled=true;
if(j===a)b.style.background="#bbf7d0";
else if(j===n)b.style.background="#fecaca";
});
$("progress").textContent=`सवाल ${i+1}/${qs.length} | स्कोर: ${score}`;
$("next").hidden=false;
$("next").textContent=i===qs.length-1?"रिजल्ट देखें":"अगला सवाल →";
}
$("next").onclick=()=>{
if(i<qs.length-1){i++;show();}
else{
$("question").textContent="🎉 क्विज़ पूरा हुआ!";
$("progress").textContent="आपका रिजल्ट";
$("options").innerHTML="";$("msg").textContent="";
$("next").hidden=true;$("result").hidden=false;
$("result").innerHTML=`<h2>आपका स्कोर: ${score}/${qs.length}</h2>`;
$("restart").hidden=false;
}
};
$("restart").onclick=()=>{i=0;score=0;show();};
show();
</script>
</body>
</html>
